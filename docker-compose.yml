# Bookora — local development stack
#
# Works with both Docker and Podman.
#
#   docker compose up -d      # or: podman-compose up -d
#   bash install.sh
#   open http://localhost:8080
#
# The web container mounts ./wp-content so the theme/plugin you copy in
# (see install.sh) persist across container rebuilds.

services:
  db:
    image: mysql:8.0
    container_name: bookora-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bookora
      MYSQL_USER: bookora
      MYSQL_PASSWORD: bookora
    volumes:
      - bookora_db_data:/var/lib/mysql

  web:
    image: docker.io/library/wordpress:php8.2-apache
    container_name: bookora-web
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: bookora
      WORDPRESS_DB_PASSWORD: bookora
      WORDPRESS_DB_NAME: bookora
    volumes:
      # :Z relabels for SELinux (required on Fedora Podman)
      - ./wp-content:/var/www/html/wp-content:Z
    ports:
      - "8080:80"

volumes:
  bookora_db_data:
