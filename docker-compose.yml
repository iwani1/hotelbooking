# Local development only. Copy .env.example to .env and set unique passwords.
# Do not expose this stack publicly or use it for real customer data.
services:
  db:
    image: ${BOOKORA_DB_IMAGE:-docker.io/library/mysql:8.0.44}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: bookora
      MYSQL_USER: bookora
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - bookora_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
  web:
    image: ${BOOKORA_WORDPRESS_IMAGE:-docker.io/library/wordpress:6.8.3-php8.2-apache}
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: bookora
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      WORDPRESS_DB_NAME: bookora
      BOOKORA_LICENSE_STORE_ID: ${BOOKORA_LICENSE_STORE_ID:-}
      BOOKORA_LICENSE_PRODUCT_ID: ${BOOKORA_LICENSE_PRODUCT_ID:-}
      WORDPRESS_CONFIG_EXTRA: |
        if (getenv('BOOKORA_LICENSE_STORE_ID')) { define('BOOKORA_LICENSE_STORE_ID', getenv('BOOKORA_LICENSE_STORE_ID')); }
        if (getenv('BOOKORA_LICENSE_PRODUCT_ID')) { define('BOOKORA_LICENSE_PRODUCT_ID', getenv('BOOKORA_LICENSE_PRODUCT_ID')); }
    volumes:
      - ./wp-content:/var/www/html/wp-content:Z
    ports:
      - "127.0.0.1:8080:80"
volumes:
  bookora_db_data:
